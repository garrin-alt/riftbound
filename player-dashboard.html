<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riftbound League — Player Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #1a1209;
      --parchment: #f5edd6;
      --gold: #c9922a;
      --gold-light: #e8b84b;
      --rust: #8b3a1a;
      --win: #5ec88a;
      --loss: #e08080;
    }
    html, body { min-height: 100%; }
    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--ink);
      color: var(--parchment);
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(139,58,26,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(201,146,42,0.08) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(201,146,42,0.015) 2px, rgba(201,146,42,0.015) 4px);
      pointer-events: none; z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding: 34px 20px 70px; }

    /* Header */
    .hdr { text-align: center; margin-bottom: 26px; }
    .hdr-brand {
      font-family: 'Cinzel', serif; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.3em; color: rgba(245,237,214,0.45); text-transform: uppercase;
    }
    .hdr-title {
      font-family: 'Cinzel', serif; font-size: 1.6rem; font-weight: 700;
      color: var(--gold-light); letter-spacing: 0.12em; margin: 6px 0 4px;
    }
    .hdr-sub { font-style: italic; font-size: 0.86rem; color: rgba(245,237,214,0.4); }
    .hdr-rule {
      width: 120px; height: 1px; margin: 16px auto 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* City toggle */
    .city-row { display: flex; justify-content: center; gap: 8px; margin: 18px 0 6px; }
    .city-btn {
      background: none; border: 1px solid rgba(201,146,42,0.25); color: rgba(245,237,214,0.5);
      font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 7px 18px; cursor: pointer; transition: all 0.2s;
    }
    .city-btn:hover { border-color: var(--gold); color: var(--gold-light); }
    .city-btn.active { border-color: var(--gold); color: var(--gold-light); background: rgba(201,146,42,0.1); }

    .status { text-align: center; font-size: 0.76rem; color: rgba(245,237,214,0.35); min-height: 20px; margin-bottom: 14px; }
    .status .err { color: #c0392b; }
    .status button {
      background: none; border: none; color: var(--gold-light); font: inherit;
      text-decoration: underline; cursor: pointer; margin-left: 6px;
    }

    /* Search */
    .search-box { position: relative; max-width: 380px; margin: 0 auto 22px; }
    .search {
      width: 100%; background: rgba(201,146,42,0.05); border: 1px solid rgba(201,146,42,0.25);
      color: var(--parchment); font-family: 'Crimson Pro', serif; font-size: 1rem;
      padding: 11px 16px; outline: none; transition: border-color 0.2s;
    }
    .search:focus { border-color: var(--gold); }
    .search::placeholder { opacity: 0.35; }
    .ac-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
      background: #1f170c; border: 1px solid rgba(201,146,42,0.3); border-top: none;
      max-height: 240px; overflow-y: auto; display: none;
    }
    .ac-list.open { display: block; }
    .ac-opt {
      padding: 9px 16px; font-size: 0.94rem; cursor: pointer;
      color: rgba(245,237,214,0.7); border-bottom: 1px solid rgba(201,146,42,0.08);
    }
    .ac-opt:hover, .ac-opt.hi { background: rgba(201,146,42,0.12); color: var(--parchment); }

    /* Tables */
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: 'Cinzel', serif; font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold);
      text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(201,146,42,0.25);
      white-space: nowrap;
    }
    td { padding: 10px 12px; font-size: 0.92rem; border-bottom: 1px solid rgba(201,146,42,0.08); }
    th.c, td.c { text-align: center; }
    th.r, td.r { text-align: right; }
    .mono { font-family: 'Cinzel', serif; font-size: 0.8rem; }
    tr.rowlink { cursor: pointer; transition: background 0.15s; }
    tr.rowlink:hover { background: rgba(201,146,42,0.07); }
    .pname { color: var(--gold-light); }
    .w { color: var(--win); font-family: 'Cinzel', serif; font-size: 0.8rem; }
    .l { color: var(--loss); font-family: 'Cinzel', serif; font-size: 0.8rem; }
    .score-gold { font-family: 'Cinzel', serif; font-size: 0.82rem; color: var(--gold-light); font-weight: 700; }
    .dim { opacity: 0.55; }
    .table-scroll { overflow-x: auto; }

    /* Player view */
    .pd-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .pd-name { font-family: 'Cinzel', serif; font-size: 1.45rem; font-weight: 700; color: var(--gold-light); letter-spacing: 0.08em; }
    .pd-rival { font-size: 0.8rem; color: rgba(245,237,214,0.4); margin-top: 4px; }
    .pd-rival span { color: var(--gold-light); cursor: pointer; text-decoration: underline dotted rgba(232,184,75,0.4); }
    .btn-ghost {
      background: none; border: 1px solid rgba(201,146,42,0.3); color: rgba(245,237,214,0.6);
      font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 8px 16px; cursor: pointer; transition: all 0.2s;
    }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold-light); }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .tile { padding: 12px 14px; background: rgba(201,146,42,0.04); border: 1px solid rgba(201,146,42,0.12); }
    .tile-l { font-size: 0.6rem; color: rgba(245,237,214,0.35); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; font-family: 'Cinzel', serif; }
    .tile-v { font-family: 'Cinzel', serif; font-size: 1.15rem; color: var(--gold-light); }
    .tile-s { font-size: 0.68rem; color: rgba(245,237,214,0.32); margin-top: 3px; }

    .hls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; margin-bottom: 22px; }
    .hl { padding: 13px 15px; background: rgba(201,146,42,0.04); border: 1px solid rgba(201,146,42,0.12); cursor: pointer; transition: border-color 0.2s; }
    .hl:hover { border-color: rgba(201,146,42,0.45); }
    .hl-l { font-size: 0.6rem; color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; font-family: 'Cinzel', serif; margin-bottom: 5px; }
    .hl-n { font-family: 'Cinzel', serif; font-size: 0.98rem; color: var(--parchment); }
    .hl-s { font-size: 0.72rem; color: rgba(245,237,214,0.42); margin-top: 4px; }

    .empty { text-align: center; padding: 70px 20px; color: rgba(245,237,214,0.2); font-style: italic; }
    .empty-icon { font-size: 2.6rem; margin-bottom: 12px; opacity: 0.3; }

    .foot { text-align: center; margin-top: 46px; font-size: 0.72rem; font-style: italic; color: rgba(245,237,214,0.22); }

    @media (max-width: 640px) {
      .wrap { padding: 24px 12px 50px; }
      td, th { padding: 8px 8px; font-size: 0.84rem; }
      .pd-name { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdr-brand">⚔ Riftbound League</div>
    <div class="hdr-title">Player Dashboard</div>
    <div class="hdr-sub">Season head-to-head stats, straight from the league record</div>
    <div class="hdr-rule"></div>
  </div>

  <div class="city-row" id="cityRow"></div>
  <div class="status" id="status"></div>

  <div class="search-box">
    <input class="search" type="text" id="search" placeholder="Search player…" autocomplete="off"/>
    <div class="ac-list" id="ac"></div>
  </div>

  <div id="index"></div>
  <div id="dash" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="empty-icon">👤</div>
    No season data found in the league record yet
  </div>

  <div class="foot">— May the best rival win —</div>
</div>

<script>
(function(){
  'use strict';

  // ── CONFIG ────────────────────────────────────────────────────────────────
  // Each city reads the same public Gist the main league site saves to.
  // Add/remove cities here; ?city=<key> in the URL preselects one.
  var CITIES = {
    abudhabi: { label: 'Abu Dhabi', gistId: '9963bf3fce242d108eab3f0b5a6a416e', gistFile: 'riftbound.json',       gistOwner: 'garrin-alt' },
    dubai:    { label: 'Dubai',     gistId: '60edd70404e9200848085d8fd3f8d157', gistFile: 'riftbound_dubai.json', gistOwner: 'garrin-alt' }
  };
  var DEFAULT_CITY = 'abudhabi';

  var activeCity = (function(){
    var q = new URLSearchParams(location.search).get('city');
    return (q && CITIES[q]) ? q : DEFAULT_CITY;
  })();

  var season = null;     // { h2h, savedPairs, rivalryPoints, updatedAt }
  var selected = null;   // currently shown player name

  // ── DATA LOADING ─────────────────────────────────────────────────────────
  // Gist API first (always current), raw gist URL as fallback (survives API
  // rate limits; may lag a few minutes behind due to CDN caching).
  async function fetchSeason(cfg){
    try {
      var res = await fetch('https://api.github.com/gists/' + cfg.gistId + '?_=' + Date.now());
      if(res.ok){
        var gist = await res.json();
        var raw = gist.files && gist.files[cfg.gistFile] && gist.files[cfg.gistFile].content;
        if(raw) return JSON.parse(raw);
      }
    } catch(e){ /* fall through to raw URL */ }
    var res2 = await fetch('https://gist.githubusercontent.com/' + cfg.gistOwner + '/' + cfg.gistId + '/raw/' + cfg.gistFile + '?_=' + Date.now());
    if(!res2.ok) throw new Error('load failed');
    return await res2.json();
  }

  async function loadCity(key){
    activeCity = key;
    selected = null;
    season = null;
    document.getElementById('search').value = '';
    renderCityRow();
    setStatus('⟳ Loading ' + CITIES[key].label + ' season data…');
    show('index');
    document.getElementById('index').innerHTML = '';
    try {
      var data = await fetchSeason(CITIES[key]);
      season = (data && data.rivalry) || {};
      eloMap = computeEloMap();
      if(!h2h().length){
        setStatus('');
        show('empty');
        return;
      }
      renderIndex();
    } catch(e){
      season = null;
      setStatus('<span class="err">✗ Could not load league data.</span><button id="retry">Retry</button>');
      var r = document.getElementById('retry');
      if(r) r.addEventListener('click', function(){ loadCity(activeCity); });
    }
  }

  function h2h(){ return (season && season.h2h) || []; }

  // ── HELPERS ──────────────────────────────────────────────────────────────
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function pct(w, l){ var d = w + l; return d ? Math.round(w/d*100) : null; }
  function pctCell(w, l){
    var p = pct(w, l);
    if(p==null) return '<span class="dim">—</span>';
    var col = p >= 55 ? 'var(--win)' : (p <= 45 ? 'var(--loss)' : 'rgba(245,237,214,0.7)');
    return '<span class="mono" style="color:'+col+'">'+p+'%</span>';
  }
  function setStatus(html){ document.getElementById('status').innerHTML = html || ''; }
  function show(which){
    document.getElementById('index').style.display = which==='index' ? 'block' : 'none';
    document.getElementById('dash').style.display  = which==='dash'  ? 'block' : 'none';
    document.getElementById('empty').style.display = which==='empty' ? 'block' : 'none';
  }
  function dataStamp(){
    var n = Object.keys(totals()).length;
    var when = season && season.updatedAt ? ' · updated ' + new Date(season.updatedAt).toLocaleDateString() : '';
    return n ? n + ' players' + when : '';
  }

  // ── ELO RATINGS ──────────────────────────────────────────────────────────
  // The league record is aggregate head-to-head (no match dates), so a
  // sequential Elo would depend on an arbitrary processing order. Instead we
  // fit a Bradley-Terry model — the order-independent rating Elo approximates —
  // by minorization-maximization (Hunter 2004) on decisive match wins, with a
  // prior of TAU virtual win + TAU virtual loss against a fixed average player
  // so unbeaten or barely-seen players stay finite. Strengths are anchored to
  // geometric mean 1 and shown on the Elo scale: R = 1500 + 400·log10(s).
  var eloMap = {}; // player -> { elo, rank, matches, provisional }

  function computeEloMap(){
    var TAU = 2.0;
    var winsMap = {}, playerSet = {};
    h2h().forEach(function(r){
      var a = r.players[0], b = r.players[1];
      var wa = r.matchWinsA || 0, wb = r.matchWinsB || 0;
      playerSet[a] = 1; playerSet[b] = 1;
      if(wa){ winsMap[a] = winsMap[a] || {}; winsMap[a][b] = (winsMap[a][b] || 0) + wa; }
      if(wb){ winsMap[b] = winsMap[b] || {}; winsMap[b][a] = (winsMap[b][a] || 0) + wb; }
    });
    var players = Object.keys(playerSet);
    if(!players.length) return {};
    var opp = {};
    players.forEach(function(p){ opp[p] = {}; });
    Object.keys(winsMap).forEach(function(a){
      Object.keys(winsMap[a]).forEach(function(b){ opp[a][b] = 1; opp[b][a] = 1; });
    });
    var s = {};
    players.forEach(function(p){ s[p] = 1; });
    for(var it = 0; it < 500; it++){
      var next = {}, logSum = 0;
      players.forEach(function(p){
        var pw = winsMap[p] || {};
        var W = TAU, denom = 2 * TAU / (s[p] + 1);
        Object.keys(pw).forEach(function(q){ W += pw[q]; });
        Object.keys(opp[p]).forEach(function(q){
          var n = (pw[q] || 0) + ((winsMap[q] || {})[p] || 0);
          denom += n / (s[p] + s[q]);
        });
        next[p] = W / denom;
      });
      players.forEach(function(p){ logSum += Math.log(next[p]); });
      var gm = Math.exp(logSum / players.length);
      var delta = 0;
      players.forEach(function(p){
        next[p] /= gm;
        delta = Math.max(delta, Math.abs(next[p] - s[p]));
      });
      s = next;
      if(delta < 1e-10) break;
    }
    var out = {};
    players.forEach(function(p){
      var pw = winsMap[p] || {}, m = 0;
      Object.keys(opp[p]).forEach(function(q){ m += (pw[q] || 0) + ((winsMap[q] || {})[p] || 0); });
      out[p] = { elo: 1500 + 400 * Math.log10(s[p]), matches: m, provisional: m < 5 };
    });
    players.slice().sort(function(a, b){ return out[b].elo - out[a].elo; })
      .forEach(function(p, i){ out[p].rank = i + 1; });
    return out;
  }

  function eloCell(p){
    var e = eloMap[p];
    if(!e) return '<span class="dim">—</span>';
    return '<span class="mono" style="color:var(--gold-light)">'+Math.round(e.elo)+'</span>'+
      (e.provisional ? ' <span class="dim" style="font-size:0.62rem">prov</span>' : '');
  }

  // Aggregate every h2h pair into per-player season totals.
  function totals(){
    var out = {};
    h2h().forEach(function(r){
      for(var i=0;i<2;i++){
        var p = r.players[i];
        var t = out[p] || (out[p] = { name:p, matches:0, mw:0, ml:0, gw:0, gl:0, close:0, opponents:0 });
        t.matches   += r.meetings||0;
        t.opponents += 1;
        t.mw += i===0 ? (r.matchWinsA||0) : (r.matchWinsB||0);
        t.ml += i===0 ? (r.matchWinsB||0) : (r.matchWinsA||0);
        t.gw += i===0 ? (r.winsA||0)      : (r.winsB||0);
        t.gl += i===0 ? (r.winsB||0)      : (r.winsA||0);
        t.close += r.close||0;
      }
    });
    return out;
  }

  // ── CITY TOGGLE ──────────────────────────────────────────────────────────
  function renderCityRow(){
    var keys = Object.keys(CITIES);
    var row = document.getElementById('cityRow');
    if(keys.length < 2){ row.style.display = 'none'; return; }
    row.innerHTML = keys.map(function(k){
      return '<button class="city-btn'+(k===activeCity?' active':'')+'" data-city="'+k+'">'+esc(CITIES[k].label)+'</button>';
    }).join('');
    row.querySelectorAll('.city-btn').forEach(function(b){
      b.addEventListener('click', function(){ if(b.dataset.city !== activeCity) loadCity(b.dataset.city); });
    });
  }

  // ── ROSTER INDEX (Elo ladder) ────────────────────────────────────────────
  function renderIndex(){
    selected = null;
    var rows = Object.values(totals()).sort(function(a,b){
      var ea = eloMap[a.name], eb = eloMap[b.name];
      return ((eb ? eb.elo : -1e9) - (ea ? ea.elo : -1e9)) || (b.matches - a.matches);
    });
    if(!rows.length){ show('empty'); return; }
    setStatus(dataStamp());
    show('index');
    document.getElementById('index').innerHTML =
      '<p style="font-size:0.72rem;color:rgba(245,237,214,0.3);font-style:italic;margin-bottom:10px;text-align:center">'+
        'Elo — Bradley-Terry rating fit to the full season head-to-head record · 1500 = league average · '+
        '<span class="dim">prov</span> = under 5 decisive matches</p>'+
      '<div class="table-scroll"><table><thead><tr>'+
        '<th class="c">#</th><th>Player</th><th class="c">Elo</th>'+
        '<th class="c">Matches</th><th class="c">Match Record</th><th class="c">Win %</th>'+
        '<th class="c">Games</th><th class="c">Opponents</th>'+
      '</tr></thead><tbody>'+
      rows.map(function(t,i){
        return '<tr class="rowlink" data-player="'+esc(t.name)+'">'+
          '<td class="c mono dim">'+(i+1)+'</td>'+
          '<td class="pname">'+esc(t.name)+'</td>'+
          '<td class="c">'+eloCell(t.name)+'</td>'+
          '<td class="c mono">'+t.matches+'</td>'+
          '<td class="c"><span class="w">'+t.mw+'W</span> – <span class="l">'+t.ml+'L</span></td>'+
          '<td class="c">'+pctCell(t.mw,t.ml)+'</td>'+
          '<td class="c mono dim">'+t.gw+'–'+t.gl+'</td>'+
          '<td class="c mono">'+t.opponents+'</td>'+
        '</tr>';
      }).join('')+'</tbody></table></div>';
    wireRowLinks(document.getElementById('index'));
  }

  // ── PLAYER VIEW ──────────────────────────────────────────────────────────
  function showPlayer(name){
    var mine = h2h().filter(function(r){ return r.players[0]===name || r.players[1]===name; });
    if(!mine.length){ renderIndex(); return; }
    selected = name;
    document.getElementById('search').value = name;
    setStatus(dataStamp());

    var opps = mine.map(function(r){
      var me = r.players[0]===name ? 0 : 1;
      return {
        opp: r.players[me?0:1],
        meetings: r.meetings||0,
        mw: me===0 ? (r.matchWinsA||0) : (r.matchWinsB||0),
        ml: me===0 ? (r.matchWinsB||0) : (r.matchWinsA||0),
        gw: me===0 ? (r.winsA||0) : (r.winsB||0),
        gl: me===0 ? (r.winsB||0) : (r.winsA||0),
        close: r.close||0,
        score: r.score||0
      };
    });

    var tot = { matches:0, mw:0, ml:0, gw:0, gl:0, close:0 };
    opps.forEach(function(o){
      tot.matches+=o.meetings; tot.mw+=o.mw; tot.ml+=o.ml; tot.gw+=o.gw; tot.gl+=o.gl; tot.close+=o.close;
    });
    var draws = Math.max(0, tot.matches - tot.mw - tot.ml);

    var topRival = opps.slice().sort(function(a,b){ return b.score-a.score; })[0];
    var settled = opps.filter(function(o){ return o.meetings >= 2 && (o.mw+o.ml) > 0; });
    var best = settled.slice().sort(function(a,b){ return (pct(b.mw,b.ml)-pct(a.mw,a.ml)) || (b.mw-a.mw); })[0];
    var worst = settled.slice().sort(function(a,b){ return (pct(a.mw,a.ml)-pct(b.mw,b.ml)) || (b.ml-a.ml); })[0];

    var declaredRival = '';
    ((season && season.savedPairs) || []).forEach(function(p){
      if(p.players[0]===name) declaredRival = p.players[1];
      if(p.players[1]===name) declaredRival = p.players[0];
    });
    var pts = season && season.rivalryPoints && season.rivalryPoints[name];

    function tile(label, val, sub){
      return '<div class="tile"><div class="tile-l">'+label+'</div><div class="tile-v">'+val+'</div>'+
        (sub ? '<div class="tile-s">'+sub+'</div>' : '')+'</div>';
    }
    function hl(icon, label, o){
      if(!o) return '';
      var p = pct(o.mw, o.ml);
      return '<div class="hl" data-player="'+esc(o.opp)+'">'+
        '<div class="hl-l">'+icon+' '+label+'</div>'+
        '<div class="hl-n">'+esc(o.opp)+'</div>'+
        '<div class="hl-s">'+o.meetings+' matches · <span class="w">'+o.mw+'W</span>–<span class="l">'+o.ml+'L</span>'+(p!=null ? ' · '+p+'%' : '')+'</div>'+
      '</div>';
    }

    var matchPct = pct(tot.mw, tot.ml);
    var gamePct  = pct(tot.gw, tot.gl);

    var dash = document.getElementById('dash');
    dash.innerHTML =
      '<div class="pd-head">'+
        '<div>'+
          '<div class="pd-name">'+esc(name)+'</div>'+
          (declaredRival ? '<div class="pd-rival">⚔ Declared rival: <span data-player="'+esc(declaredRival)+'">'+esc(declaredRival)+'</span></div>' : '')+
        '</div>'+
        '<button class="btn-ghost" id="backBtn">← All Players</button>'+
      '</div>'+

      '<div class="tiles">'+
        (function(){
          var e = eloMap[name];
          if(!e) return '';
          return tile('Elo Rating', Math.round(e.elo),
            'rank #'+e.rank+' of '+Object.keys(eloMap).length+(e.provisional ? ' · provisional' : ''));
        })()+
        tile('Matches', tot.matches, draws ? draws+' unreported/draw' : '')+
        tile('Match Record', '<span class="w" style="font-size:1.05rem">'+tot.mw+'W</span> <span class="dim">–</span> <span class="l" style="font-size:1.05rem">'+tot.ml+'L</span>', '')+
        tile('Match Win %', matchPct!=null ? matchPct+'%' : '—', '')+
        tile('Game Record', tot.gw+'–'+tot.gl, gamePct!=null ? gamePct+'% of games' : '')+
        tile('Close Matches', tot.close, 'went the distance')+
        tile('Opponents', opps.length, 'faced this season')+
        (pts ? tile('Rivalry Pts', '<span class="score-gold" style="font-size:1.05rem">'+(pts.points||0)+'</span>', (pts.rivalWins||0)+'W–'+(pts.rivalLosses||0)+'L vs rival') : '')+
        (pts && (pts.shadowPoints||pts.shadowWins||pts.shadowDraws) ? tile('Shadow Pts', '<span style="color:#9b8cc4">'+(pts.shadowPoints||0)+'</span>', (pts.shadowWins||0)+'W–'+(pts.shadowDraws||0)+'D shadow') : '')+
      '</div>'+

      '<div class="hls">'+
        hl('🔥','Hottest Rivalry', topRival)+
        hl('🎯','Best Matchup', best)+
        hl('💀','Nemesis', worst)+
      '</div>'+

      '<div class="table-scroll"><table><thead><tr>'+
        '<th>Opponent</th><th class="c">Matches</th><th class="c">Record</th>'+
        '<th class="c">Win %</th><th class="c">Games</th><th class="c">Close</th><th class="r">Rivalry</th>'+
      '</tr></thead><tbody>'+
      opps.sort(function(a,b){ return b.meetings-a.meetings || b.score-a.score; }).map(function(o){
        return '<tr class="rowlink" data-player="'+esc(o.opp)+'">'+
          '<td>'+esc(o.opp)+'</td>'+
          '<td class="c mono">'+o.meetings+'</td>'+
          '<td class="c"><span class="w">'+o.mw+'W</span> – <span class="l">'+o.ml+'L</span></td>'+
          '<td class="c">'+pctCell(o.mw,o.ml)+'</td>'+
          '<td class="c mono dim">'+o.gw+'–'+o.gl+'</td>'+
          '<td class="c mono">'+o.close+'</td>'+
          '<td class="r"><span class="score-gold">'+Math.round(o.score*100)+'</span></td>'+
        '</tr>';
      }).join('')+'</tbody></table></div>';

    show('dash');
    document.getElementById('backBtn').addEventListener('click', function(){
      document.getElementById('search').value = '';
      renderIndex();
    });
    wireRowLinks(dash);
    dash.querySelectorAll('.hl[data-player], .pd-rival span[data-player]').forEach(function(el){
      el.addEventListener('click', function(){ showPlayer(el.dataset.player); });
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function wireRowLinks(root){
    root.querySelectorAll('tr.rowlink').forEach(function(row){
      row.addEventListener('click', function(){ showPlayer(row.dataset.player); });
    });
  }

  // ── SEARCH ───────────────────────────────────────────────────────────────
  var searchEl = document.getElementById('search');
  var acEl = document.getElementById('ac');
  function closeAc(){ acEl.classList.remove('open'); acEl.innerHTML = ''; }
  searchEl.addEventListener('input', function(){
    var q = searchEl.value.trim().toLowerCase();
    if(!q){ closeAc(); renderIndex(); return; }
    var names = Object.keys(totals()).filter(function(n){ return n.toLowerCase().indexOf(q) !== -1; }).sort().slice(0, 8);
    if(!names.length){ closeAc(); return; }
    acEl.innerHTML = names.map(function(n){ return '<div class="ac-opt" data-player="'+esc(n)+'">'+esc(n)+'</div>'; }).join('');
    acEl.classList.add('open');
    acEl.querySelectorAll('.ac-opt').forEach(function(opt){
      opt.addEventListener('mousedown', function(e){ e.preventDefault(); closeAc(); showPlayer(opt.dataset.player); });
    });
  });
  searchEl.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    var first = acEl.querySelector('.ac-opt');
    if(first){ closeAc(); showPlayer(first.dataset.player); }
  });
  searchEl.addEventListener('blur', function(){ setTimeout(closeAc, 150); });

  // ── GO ───────────────────────────────────────────────────────────────────
  renderCityRow();
  loadCity(activeCity);
})();
</script>
</body>
</html>
